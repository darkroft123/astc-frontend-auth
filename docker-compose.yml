name: astc-frontend-auth

version: "3.9"

services:
  frontend-auth:
    build: ./services/frontend-auth
    container_name: astc-frontend-auth
    ports:
      - "3003:3000"
    volumes:
      - ./services/frontend-auth:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:8081/graphql
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: npm run dev
    networks:
      - astc-network
    restart: unless-stopped

networks:
  astc-network:
    driver: bridge